<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Future, Unboxed · 网格模板</title><link rel="stylesheet" href="style.css"></head><body>
<nav class="toolbar"><span>FUTURE, UNBOXED / GRID TEMPLATE</span><button id="grid-toggle">显示网格</button></nav>
<main class="stage"><article class="poster" id="poster">
 <div class="background"></div><div class="shade"></div>
 <svg class="ornaments" viewBox="0 0 1240 1660" aria-hidden="true"></svg>
 <div class="layout">
  <div class="focus" aria-label="产品清晰高亮区域"><div class="sharp-photo"></div></div>
  <section class="product"><h1 data-field="product"></h1><p data-field="subtitle"></p></section>
  <div class="eyebrow"><span data-field="category"></span><span data-field="description"></span></div>
  <section class="identity"><h2 data-field="seriesZh"></h2><div class="company"><span>name</span><p data-field="company"></p></div></section>
  <div class="series" data-field="seriesEn"></div>
  <footer><img src="assets/logo.svg" alt="mushenzhen"><span data-field="website"></span></footer>
 </div>
 <svg class="annotations" viewBox="0 0 1240 1660" aria-hidden="true"></svg>
 <div class="grid-overlay" aria-hidden="true"></div>
</article></main><script src="data.js"></script><script src="app.js"></script></body></html>
